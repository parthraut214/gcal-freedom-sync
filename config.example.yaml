users:
  - name: "alice"
    calendars:
      - name: "work"
        id: "your-work-calendar-id@group.calendar.google.com"
        filter_list_ids: [YOUR_BLOCKLIST_ID]
        block_everything: false
        block_apps: true
        locked_mode: true
      - name: "sleep"
        id: "your-sleep-calendar-id@group.calendar.google.com"
        filter_list_ids: [YOUR_BLOCKLIST_ID]
        block_everything: false
        block_apps: true
        locked_mode: true
    device_ids: [DEVICE_ID_1, DEVICE_ID_2]   # find via Freedom.to --sniff
    google_credentials_path: "credentials.json"
    google_token_path: "token_alice.json"
    state_path: "state_alice.json"
    telegram_chat_id: 0000000000              # send /start to your bot, then check getUpdates

  # Add more users here — they share the same Freedom account and Telegram bot

poll:
  interval_seconds: 60
  lookahead_seconds: 30
  notify_thresholds_seconds: [600, 120]   # 10min and 2min warnings

freedom:
  session_path: "freedom_session.json"     # generated via: python freedom_client.py --setup-session

notifications:
  telegram:
    token: "YOUR_TELEGRAM_BOT_TOKEN"       # from @BotFather
